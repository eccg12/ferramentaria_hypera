<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FerraMon · Ferramentaria Guiada por Dados</title>
    <meta
      name="description"
      content="Mockup navegável da plataforma agêntica de ferramentaria — Monoda Consulting × Google Cloud. Ambiente demonstrativo, dados fictícios."
    />
    <!--
      Tipografia servida do próprio pacote. Os arquivos woff2 estão em
      public/fontes e os caminhos são relativos ao documento, para que a build
      abra por file:// sem servidor e sem rede. `local()` aproveita a fonte
      instalada na máquina de quem apresenta, quando existir.
    -->
    <style>
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: local('Montserrat Medium'), local('Montserrat'),
          url('./fontes/montserrat-latin-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Montserrat SemiBold'), url('./fontes/montserrat-latin-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Montserrat';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: local('Montserrat Bold'), url('./fontes/montserrat-latin-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('IBM Plex Mono'), url('./fontes/plex-mono-latin-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: local('IBM Plex Mono Medium'), url('./fontes/plex-mono-latin-500.woff2') format('woff2');
      }
      html {
        background: #071723;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/principal.tsx"></script>
  </body>
</html>
